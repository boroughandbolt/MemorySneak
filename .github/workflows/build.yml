name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Build Memory Sneak
        run: |
          xcodebuild -project MemorySneak.xcodeproj \
            -target MemorySneak \
            -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Zip the app
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Release/MemorySneak.app/Contents/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/Release/MemorySneak.app "MemorySneak-v$VERSION.zip"

      - name: Save the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: MemorySneak-v${{ env.VERSION }}
          path: MemorySneak-v*.zip

      - name: Attach the download to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MemorySneak-v*.zip --clobber
          else
            gh release create "$TAG" MemorySneak-v*.zip \
              --title "Memory Sneak $VERSION" \
              --generate-notes
          fi
