name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Build Memory Sneak
        run: |
          xcodebuild -project MemorySneak.xcodeproj \
            -target MemorySneak \
            -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Zip the app
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Release/MemorySneak.app/Contents/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/Release/MemorySneak.app "MemorySneak-v$VERSION.zip"

      - name: Save the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: MemorySneak-v${{ env.VERSION }}
          path: MemorySneak-v*.zip

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MemorySneak-v*.zip \
            --title "Memory Sneak $VERSION" \
            --generate-notes
